const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const SLOT = 'lucine.chiave.' + D.salt;
// Lucine si travasa in questa pagina pezzo per pezzo. Niente document.write: cancellerebbe gli "ascoltatori"
// che Bluefy mette nella pagina per far funzionare il Bluetooth.
async function apri(key) {
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, key, bytes(D.ct)));
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const codes = [...doc.querySelectorAll('script')].map(s => { const c = s.textContent; s.remove(); return c; });
  document.querySelectorAll('head style, head title').forEach(n => n.remove());
  document.head.append(...[...doc.head.childNodes].map(n => document.adoptNode(n)));
  document.title = doc.title;
  for (const a of doc.body.attributes) document.body.setAttribute(a.name, a.value);
  document.body.replaceChildren(...[...doc.body.childNodes].map(n => document.adoptNode(n)));
  for (const c of codes) { const s = document.createElement('script'); s.textContent = c; document.body.appendChild(s); }
}
async function chiave(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(D.salt), iterations: D.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
(async () => { // chiave ricordata su questo telefono?
  try {
    const j = localStorage.getItem(SLOT);
    if (j) return apri(await crypto.subtle.importKey('jwk', JSON.parse(j), { name: 'AES-GCM' }, false, ['decrypt']));
  } catch { try { localStorage.removeItem(SLOT); } catch {} }
  document.getElementById('p').focus();
})();
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = ''; b.textContent = 'APRO…';
  try {
    const ricorda = document.getElementById('r').checked; // dopo apri() questa pagina non c'è più
    const key = await chiave(document.getElementById('p').value);
    const jwk = await crypto.subtle.exportKey('jwk', key);
    await apri(key);
    if (ricorda) try { localStorage.setItem(SLOT, JSON.stringify(jwk)); } catch {}
  } catch {
    e.textContent = 'Password sbagliata'; b.disabled = false; b.textContent = 'APRI';
  }
};
})();
